<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Touch Notice Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/page.css">
<style>
:root{
  --stage-a:#3f4f86; --pink:#ef5fa7;
  --ink:#fff; --ink-soft:rgba(255,255,255,.78);
  --glass:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.24); --glass-line:rgba(255,255,255,.28);
  --paper:#fff; --paper-ink:#28304a; --paper-soft:#5c6480;
  --font:"Plus Jakarta Sans","Noto Sans SC",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage-a);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.stage{position:relative;height:100%;display:flex;flex-direction:column;padding-inline:clamp(16px,3vw,48px);
  background:radial-gradient(120% 90% at 85% 10%,rgba(255,255,255,.14),transparent 60%),radial-gradient(90% 80% at 0% 100%,rgba(0,0,0,.28),transparent 70%),var(--stage-a)}
.bar{display:flex;align-items:center;gap:16px;padding-block:clamp(14px,2.2vh,26px)}
.bar h1{font-size:clamp(17px,1.7vw,26px);font-weight:600;margin:0;flex:1;min-width:0;text-wrap:balance}
.crumb{display:flex;align-items:center}
.pill{background:#fff;color:var(--stage-a);font-weight:700;font-size:14px;padding:8px 18px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.logo{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--glass-line);font-size:13px;color:var(--ink-soft);font-weight:600;max-width:240px}
.logo img{height:40px;max-width:160px;object-fit:contain}
.navbtn{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-line);padding:9px 16px;border-radius:12px;font-weight:600;font-size:15px}
.navbtn svg{width:18px;height:18px}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:center;padding-bottom:4vh}
.hero{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/10;max-width:100%;box-shadow:0 18px 40px rgba(10,15,40,.35);background:#24305a}
.hero canvas,.hero img{width:100%;height:100%;display:block;object-fit:cover}
.hero .cap{position:absolute;left:18px;bottom:16px;background:rgba(20,25,50,.55);backdrop-filter:blur(6px);padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600}
.pick{display:flex;flex-direction:column;gap:18px}
.pick p{margin:0;font-size:clamp(15px,1.3vw,19px);color:var(--ink-soft);display:flex;gap:8px;align-items:center}
.countries{display:flex;flex-wrap:wrap;gap:22px}
.country{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:16px;padding:10px;border-radius:16px}
.country:active{background:var(--glass)}
.flag{width:84px;height:84px;border-radius:50%;overflow:hidden;display:flex;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 8px 18px rgba(0,0,0,.3)}
.crumb .flag{box-shadow:0 0 0 2px #fff}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 0 14px rgba(255,255,255,0)}}
.gridwrap{flex:1;display:grid;place-items:center;padding-bottom:4vh;overflow:auto}
.tiles{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:clamp(14px,2vw,28px);width:min(1100px,100%)}
.tile{aspect-ratio:1.25;max-width:100%;border-radius:22px;background:linear-gradient(160deg,var(--glass-hi),var(--glass));border:1px solid var(--glass-line);
  box-shadow:0 10px 26px rgba(10,15,40,.25),inset 0 1px 0 rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  font-weight:700;font-size:clamp(14px,1.35vw,20px);padding:10px;text-align:center;transition:transform .15s}
.tile svg{width:clamp(34px,3.6vw,58px);height:auto;color:#fff}
.tile:active{transform:scale(.96)}
.listwrap{flex:1;min-height:0;display:flex;gap:18px;padding-bottom:3vh}
.list{flex:1;min-width:0;overflow-y:auto;scroll-behavior:smooth;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:16px;background:linear-gradient(90deg,var(--glass-hi),var(--glass));border:1px solid var(--glass-line);border-radius:16px;padding:18px 22px;min-height:74px}
.row b{flex:1;font-size:clamp(16px,1.5vw,22px);font-weight:600;min-width:0}
.row small{display:block;font-weight:500;font-size:13px;color:var(--ink-soft);margin-top:3px}
.go{background:var(--pink);color:#fff;font-weight:700;padding:11px 18px;border-radius:10px;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.go svg{width:16px;height:16px}
.empty{color:var(--ink-soft);font-size:18px;padding:30px 4px}
.scroller{display:flex;flex-direction:column;justify-content:center;gap:10px}
.scroller button{width:48px;height:48px;border-radius:50%;background:rgba(20,25,50,.45);border:2px solid #fff;display:grid;place-items:center}
.scroller svg{width:20px;height:20px}
.viewer{position:fixed;inset:0;background:rgba(15,20,40,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{width:min(1100px,100%);height:min(86vh,760px);background:var(--paper);color:var(--paper-ink);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.35);position:relative}
.sheet .page{flex:1;min-height:0;overflow:auto;padding:clamp(20px,4vw,56px) clamp(20px,5vw,72px);position:relative}
.mark{position:absolute;top:18px;right:24px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--paper-soft)}
.mark img{height:28px;max-width:120px;object-fit:contain}
.ctrl{display:flex;justify-content:center;align-items:center;gap:12px;padding:14px;border-top:1px solid #eceef5;flex-wrap:wrap}
.ctrl button{display:flex;align-items:center;gap:8px;background:#fff;color:var(--paper-ink);border:1.5px solid #d7c3dc;border-radius:999px;padding:8px 18px;font-weight:600;font-size:15px}
.ctrl button svg{width:16px;height:16px;color:var(--pink)}
.ctrl button:disabled{opacity:.35}
.ctrl .count{font-size:14px;color:var(--paper-soft);font-variant-numeric:tabular-nums;min-width:60px;text-align:center}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--paper);border-radius:20px}
.loading div{background:#2b2f3c;color:#fff;border-radius:12px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:12px;font-weight:600}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.faces{display:flex;gap:20px;flex-wrap:wrap;margin:24px 0}
.faces button{font-size:clamp(44px,5vw,70px);background:#f3f4f9;border-radius:18px;padding:12px 20px;line-height:1;border:3px solid transparent}
.faces button[aria-pressed="true"]{border-color:var(--pink);background:#fde8f3}
.thanks{color:#2f8a4b;font-weight:700;font-size:20px}
.idle{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(15,20,40,.85);padding:12px 20px;border-radius:12px;font-weight:600;z-index:20;display:flex;gap:14px;align-items:center}
.idle button{background:#fff;color:var(--stage-a);border-radius:8px;padding:6px 12px;font-weight:700}
.previewbar{position:fixed;left:0;right:0;top:0;z-index:30;background:#ffd34d;color:#3a2c00;text-align:center;font-weight:700;font-size:14px;padding:6px}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--stage-a);z-index:40}
@media (max-width:860px){
  .home{grid-template-columns:1fr;align-content:start;overflow:auto}
  .tiles{--cols:2!important}
  .logo,.scroller{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="boot" id="boot"><span class="spin"></span></div>
<div class="previewbar" id="previewbar" hidden>PREVIEW: this shows unpublished changes. The real screen won't change until you press Publish.</div>
<div class="stage">
  <header class="bar">
    <div class="crumb" id="crumb" hidden></div>
    <h1 id="title"></h1>
    <button class="navbtn" id="back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg><span data-t="back"></span></button>
    <button class="navbtn" id="homeBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="home"></span></button>
    <button class="pill" id="lang"></button>
    <div class="logo" id="logo"></div>
  </header>
  <main>
    <section class="screen home" id="s-home">
      <div class="hero" id="hero"><span class="cap" id="heroCap"></span></div>
      <div class="pick">
        <p><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg><span id="tapPrompt"></span></p>
        <div class="countries" id="countries"></div>
      </div>
    </section>
    <section class="screen" id="s-cats" hidden><div class="gridwrap"><div class="tiles" id="tiles"></div></div></section>
    <section class="screen" id="s-list" hidden>
      <div class="listwrap">
        <div class="list" id="list"></div>
        <div class="scroller">
          <button id="up" aria-label="Scroll up"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M6 15l6-6 6 6"/></svg></button>
          <button id="down" aria-label="Scroll down"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="sheet">
    <div class="page docpage" id="page"></div>
    <div class="ctrl">
      <button id="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span data-t="prev"></span></button>
      <span class="count" id="count"></span>
      <button id="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span data-t="next"></span></button>
      <button id="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-t="close"></span></button>
    </div>
    <div class="loading" id="loading" hidden><div><span class="spin"></span><span data-t="loading"></span></div></div>
  </div>
</div>
<div class="idle" id="idle" hidden><span id="idleTxt"></span><button id="stay" data-t="stay"></button></div>

<script src="/assets/common.js"></script>
<script>
const UI={
 en:{back:"Back",home:"Home",prev:"Previous",next:"Next",close:"Close",loading:"Loading…",view:"View details",stay:"I'm still here",idle:s=>`No activity. Returning to the start in ${s}s`,lang:"中文",empty:"Nothing here yet."},
 zh:{back:"返回",home:"首页",prev:"左翻页",next:"右翻页",close:"关闭",loading:"加载中…",view:"查看详情",stay:"继续使用",idle:s=>`无操作，${s} 秒后返回首页`,lang:"English",empty:"暂无内容。"}
};
const {esc,pick,icon,flag,renderPage}=TNB;
const $=id=>document.getElementById(id);
const PREVIEW=new URLSearchParams(location.search).has("preview");
let C=null, lang="en", country=null, cat=null, doc=null, pg=0, rating=null, screen="home";
const t=k=>UI[lang][k];
const L=o=>pick(o,lang);
const vis=a=>(a||[]).filter(x=>x.visible!==false);

/* ---------- content loading ---------- */
async function fetchContent(){
  try{
    if(PREVIEW){
      const tok=localStorage.getItem("tnb_token");
      const r=await fetch("/api/content?draft=1",{headers:{authorization:"Bearer "+tok},cache:"no-store"});
      if(r.ok) return r.json();
    }
    const r=await fetch("/api/content",{cache:"no-store"});
    if(r.ok){const c=await r.json(); try{localStorage.setItem("tnb_cache",JSON.stringify(c))}catch(e){} return c;}
  }catch(e){}
  try{const cached=localStorage.getItem("tnb_cache"); if(cached) return JSON.parse(cached);}catch(e){}
  const r=await fetch("/content.json",{cache:"no-store"}); return r.json();
}
function stamp(c){return (c&&(c.publishedAt||c.updatedAt))||""}

async function boot(){
  C=await fetchContent();
  $("previewbar").hidden=!PREVIEW;
  applySettings(); goHome(); $("boot").hidden=true;
}
function applySettings(){
  const s=C.settings||{};
  const r=document.documentElement.style;
  r.setProperty("--stage-a",s.colors?.background||"#3f4f86");
  r.setProperty("--pink",s.colors?.button||"#ef5fa7");
  $("logo").innerHTML=s.logo?`<img src="${esc(s.logo)}" alt="${esc(s.brandName||"")}">`:`<span>${esc(s.brandName||"")}</span>`;
  $("logo").hidden=!s.logo&&!s.brandName;
  $("lang").hidden=s.showLanguageButton===false;
  if(s.showLanguageButton===false) lang="en";
  const hero=$("hero"); hero.querySelectorAll("canvas,img").forEach(e=>e.remove());
  if(s.heroImage){const im=new Image();im.src=s.heroImage;im.alt="";hero.prepend(im);} else {const cv=document.createElement("canvas");cv.width=960;cv.height=600;hero.prepend(cv);drawScene(cv);}
}

/* ---------- screens ---------- */
function show(name){for(const s of ["home","cats","list"])$("s-"+s).hidden=s!==name;screen=name;renderBar();}
function renderBar(){
  const s=C.settings||{}, skip=s.skipCountryStep||vis(C.countries).length===0;
  $("back").hidden=screen==="home"||(skip&&screen==="cats");
  $("homeBtn").hidden=screen==="home"||(skip&&screen==="cats");
  $("crumb").hidden=!country||screen==="home";
  if(country) $("crumb").innerHTML=flag(country,34);
  $("title").textContent=screen==="home"||(skip&&screen==="cats")?L(s.welcome):[country&&L(country.name),screen==="list"&&cat&&L(cat.name)].filter(Boolean).join(" · ");
  $("lang").textContent=t("lang");
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $("heroCap").textContent=L(s.heroCaption); $("heroCap").hidden=!L(s.heroCaption)||!!s.heroImage&&!L(s.heroCaption);
  $("tapPrompt").textContent=L(s.tapPrompt);
}
function renderCountries(){
  $("countries").innerHTML=vis(C.countries).map((c,i)=>`<button class="country" data-c="${esc(c.id)}">${flag(c).replace('class="flag"',`class="flag${i===0?" pulse":""}"`)}<span>${esc(L(c.name))}</span></button>`).join("");
}
function renderTiles(){
  const cats=vis(C.categories);
  $("tiles").style.setProperty("--cols",cats.length<=4?Math.max(cats.length,2):cats.length<=6?3:4);
  $("tiles").innerHTML=cats.map(c=>`<button class="tile" data-cat="${esc(c.id)}">${icon(c.icon)}<span>${esc(L(c.name))}</span></button>`).join("");
}
function renderList(){
  const docs=vis(cat.docs);
  $("list").innerHTML=docs.length?docs.map(d=>`<div class="row"><b>${esc(L(d.title))}${L(d.subtitle)?`<small>${esc(L(d.subtitle))}</small>`:""}</b><button class="go" data-doc="${esc(d.id)}">${t("view")}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>`).join(""):`<p class="empty">${t("empty")}</p>`;
  $("list").scrollTop=0;
}
function renderAll(){renderBar();renderCountries();renderTiles();if(cat&&cat.kind!=="feedback")renderList();if(!$("viewer").hidden)renderPageView();}

function openCategory(c){
  cat=c;
  if(c.kind==="feedback"){doc={feedback:true,pages:[{}]};pg=0;rating=null;$("viewer").hidden=false;renderPageView();return;}
  const docs=vis(c.docs);
  if(docs.length===1){openDoc(docs[0]);return;} // one item: go straight to it
  renderList();show("list");
}
function openDoc(d){
  doc=d;pg=0;rating=null;$("viewer").hidden=false;$("loading").hidden=false;
  setTimeout(()=>{$("loading").hidden=true;renderPageView();},450);
}
function mark(){const s=C.settings||{};return `<div class="mark">${s.logo?`<img src="${esc(s.logo)}" alt="">`:esc(s.brandName||"")}</div>`;}
function renderPageView(){
  if(doc.feedback){
    const faces=["😞","😐","🙂","😄"];
    $("page").innerHTML=mark()+`<h2>${esc(L(cat.question)||L(cat.name))}</h2><div class="faces">${faces.map((f,i)=>`<button data-rate="${i}" aria-pressed="${rating===i}" aria-label="Rating ${i+1} of 4">${f}</button>`).join("")}</div>${rating!==null?`<p class="thanks">${esc(L(cat.thanks))}</p>`:""}`;
  } else $("page").innerHTML=mark()+renderPage(doc.pages[pg],lang);
  $("page").scrollTop=0;
  const n=(doc.pages||[]).length||1;
  $("count").textContent=`${pg+1} / ${n}`;
  $("count").hidden=$("prev").hidden=$("next").hidden=n<=1;
  $("prev").disabled=pg===0;$("next").disabled=pg>=n-1;
}
function closeDoc(){$("viewer").hidden=true;doc=null;if(cat&&(cat.kind==="feedback"||vis(cat.docs).length===1))cat=null;}
function goHome(){
  closeDoc();cat=null;
  const s=C.settings||{}, cs=vis(C.countries);
  renderAll();
  if(s.skipCountryStep||cs.length===0){country=null;show("cats");}
  else {country=null;show("home");}
}

document.addEventListener("click",e=>{
  const c=e.target.closest("[data-c]"); if(c){country=C.countries.find(x=>x.id===c.dataset.c);show("cats");return;}
  const k=e.target.closest("[data-cat]"); if(k){openCategory(C.categories.find(x=>x.id===k.dataset.cat));return;}
  const d=e.target.closest("[data-doc]"); if(d){openDoc(cat.docs.find(x=>x.id===d.dataset.doc));return;}
  const r=e.target.closest("[data-rate]"); if(r&&rating===null){rating=+r.dataset.rate;renderPageView();if(!PREVIEW)fetch("/api/feedback",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({rating})}).catch(()=>{});setTimeout(()=>{if(doc&&doc.feedback)closeDoc();},2500);return;}
});
$("back").onclick=()=>{if(screen==="list"){cat=null;show("cats");}else goHome();};
$("homeBtn").onclick=goHome;
$("lang").onclick=()=>{lang=lang==="en"?"zh":"en";document.documentElement.lang=lang==="en"?"en":"zh-CN";renderAll();};
$("prev").onclick=()=>{if(pg>0){pg--;renderPageView();}};
$("next").onclick=()=>{if(pg<doc.pages.length-1){pg++;renderPageView();}};
$("close").onclick=closeDoc;
$("viewer").addEventListener("click",e=>{if(e.target===$("viewer"))closeDoc();});
$("up").onclick=()=>$("list").scrollBy({top:-240});
$("down").onclick=()=>$("list").scrollBy({top:240});

/* ---------- idle reset + live updates ---------- */
let last=Date.now();
["pointerdown","keydown","wheel","touchstart"].forEach(ev=>addEventListener(ev,()=>{last=Date.now();$("idle").hidden=true;},{passive:true}));
$("stay").onclick=()=>{last=Date.now();$("idle").hidden=true;};
setInterval(()=>{
  if(!C)return;
  const idleSecs=Math.max(15,+(C.settings?.idleSeconds)||60), warn=10;
  const atStart=$("viewer").hidden&&(screen==="home"||(screen==="cats"&&(C.settings?.skipCountryStep||!vis(C.countries).length)))&&!country;
  if(atStart){$("idle").hidden=true;return;}
  const left=idleSecs-Math.floor((Date.now()-last)/1000);
  if(left<=0){goHome();lang="en";renderAll();$("idle").hidden=true;last=Date.now();}
  else if(left<=warn){$("idle").hidden=false;$("idleTxt").textContent=t("idle")(left);}
},500);
// Check for newly published content every 60 seconds; swap it in when nobody is using the screen.
setInterval(async()=>{
  if(Date.now()-last<20000)return;
  try{const fresh=await fetchContent(); if(stamp(fresh)!==stamp(C)){C=fresh;applySettings();goHome();}}catch(e){}
},60000);

/* ---------- default home picture (used until a photo is uploaded) ---------- */
function drawScene(cv){
  const x=cv.getContext("2d"),W=cv.width,H=cv.height;
  const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(7);
  const houses=[];let px=0;
  while(px<W){const w=30+rnd()*50,h=60+rnd()*110;houses.push({x:px,w,h,c:["#c9744c","#d98a5b","#b8603f","#e3a06d","#a9553a","#e9c39b"][Math.floor(rnd()*6)]});px+=w-4;}
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function draw(time){
    if(!cv.isConnected)return;
    const g=x.createLinearGradient(0,0,0,H*.5);g.addColorStop(0,"#9fc4e4");g.addColorStop(1,"#e7eef3");x.fillStyle=g;x.fillRect(0,0,W,H);
    const hz=H*.48;x.fillStyle="#b7c7d3";x.fillRect(0,hz-30,W,30);
    houses.forEach(h=>{const y=hz+40-h.h;x.fillStyle=h.c;x.fillRect(h.x,y,h.w,h.h);x.fillStyle="rgba(0,0,0,.18)";for(let wy=y+12;wy<hz+30;wy+=22)for(let wx=h.x+8;wx<h.x+h.w-8;wx+=14)x.fillRect(wx,wy,6,9);x.fillStyle="#8e4630";x.fillRect(h.x-2,y-6,h.w+4,8);});
    x.fillStyle="#efe9dc";x.fillRect(W*.62,hz-110,120,150);x.beginPath();x.arc(W*.62+60,hz-110,62,Math.PI,0);x.fill();x.fillRect(W*.62+52,hz-200,16,30);
    const wg=x.createLinearGradient(0,hz+40,0,H);wg.addColorStop(0,"#3fa7a5");wg.addColorStop(1,"#1d6f86");x.fillStyle=wg;x.fillRect(0,hz+40,W,H);
    x.strokeStyle="rgba(255,255,255,.35)";x.lineWidth=2;
    for(let i=0;i<14;i++){const y=hz+60+i*22;x.beginPath();for(let xx=0;xx<=W;xx+=20){const yy=y+Math.sin(xx/40+time/700+i)*3;xx?x.lineTo(xx,yy):x.moveTo(xx,yy);}x.stroke();}
    const bx=((time/30)%(W+120))-60;x.fillStyle="#fff";x.beginPath();x.moveTo(bx,hz+150);x.lineTo(bx+60,hz+150);x.lineTo(bx+48,hz+164);x.lineTo(bx+8,hz+164);x.fill();
    if(!reduce)requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}
