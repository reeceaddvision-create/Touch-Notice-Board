<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Touch Notice Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one full-height kiosk stage; screens swap in place (home → categories → document list → viewer overlay). Single deliberate look, like a lobby display. */
:root{
  --stage-a:#3f4f86; --stage-b:#5b6aa6; --stage-c:#2f3b6b;
  --ink:#ffffff; --ink-soft:rgba(255,255,255,.78);
  --glass:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.24); --glass-line:rgba(255,255,255,.28);
  --pink:#ef5fa7; --pink-b:#d9418f;
  --paper:#ffffff; --paper-ink:#28304a; --paper-soft:#5c6480; --alert:#d23b3b;
  --font:"Plus Jakarta Sans","Noto Sans SC",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage-c);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.stage{position:relative;height:100%;display:flex;flex-direction:column;
  background:radial-gradient(120% 90% at 85% 10%,var(--stage-b),transparent 60%),radial-gradient(90% 80% at 0% 100%,var(--stage-c),transparent 70%),var(--stage-a);
  padding-inline:clamp(16px,3vw,48px)}

/* top bar */
.bar{display:flex;align-items:center;gap:16px;padding-block:clamp(14px,2.2vh,26px)}
.bar h1{font-size:clamp(17px,1.7vw,26px);font-weight:600;margin:0;flex:1;min-width:0;text-wrap:balance}
.crumb{display:flex;align-items:center;gap:10px}
.crumb .flag{width:34px;height:34px}
.pill{background:#fff;color:#3f4f86;font-weight:700;font-size:14px;padding:8px 18px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.logo{display:flex;align-items:center;gap:8px;padding-left:14px;border-left:1px solid var(--glass-line);font-size:12px;line-height:1.15;color:var(--ink-soft);font-weight:600}
.logo i{width:30px;height:30px;border-radius:50%;border:2px dashed var(--ink-soft);display:grid;place-items:center;font-style:normal;font-size:10px}
.navbtn{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-line);padding:9px 16px;border-radius:12px;font-weight:600;font-size:15px}
.navbtn svg{width:18px;height:18px}

main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:in .35s ease}
.screen[hidden]{display:none!important}
@keyframes in{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:center;padding-bottom:4vh}
.hero{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/10;max-width:100%;box-shadow:0 18px 40px rgba(10,15,40,.35)}
.hero canvas{width:100%;height:100%;display:block}
.hero .cap{position:absolute;left:18px;bottom:16px;background:rgba(20,25,50,.55);backdrop-filter:blur(6px);padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600}
.pick{display:flex;flex-direction:column;gap:18px}
.pick p{margin:0;font-size:clamp(15px,1.3vw,19px);color:var(--ink-soft);display:flex;gap:8px;align-items:center}
.countries{display:flex;flex-wrap:wrap;gap:22px}
.country{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:16px;padding:10px;border-radius:16px;transition:background .2s}
.country:active{background:var(--glass)}
.flag{width:84px;height:84px;border-radius:50%;overflow:hidden;display:flex;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 8px 18px rgba(0,0,0,.3)}
.flag span{flex:1}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 0 14px rgba(255,255,255,0)}}

/* category grid */
.gridwrap{flex:1;display:grid;place-items:center;padding-bottom:4vh}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2vw,28px);width:min(1100px,100%)}
.tile{aspect-ratio:1.25;max-width:100%;border-radius:22px;background:linear-gradient(160deg,var(--glass-hi),var(--glass));border:1px solid var(--glass-line);
  box-shadow:0 10px 26px rgba(10,15,40,.25),inset 0 1px 0 rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  font-weight:700;font-size:clamp(14px,1.35vw,20px);transition:transform .15s,background .15s}
.tile svg{width:clamp(34px,3.6vw,58px);height:auto;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile:active{transform:scale(.96);background:var(--glass-hi)}

/* document list */
.listwrap{flex:1;min-height:0;display:flex;gap:18px;padding-bottom:3vh}
.list{flex:1;min-width:0;overflow-y:auto;scroll-behavior:smooth;display:flex;flex-direction:column;gap:14px;padding-right:4px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:16px;background:linear-gradient(90deg,var(--glass-hi),var(--glass));border:1px solid var(--glass-line);border-radius:16px;padding:18px 22px;min-height:74px}
.row b{flex:1;font-size:clamp(16px,1.5vw,22px);font-weight:600;min-width:0}
.row small{display:block;font-weight:500;font-size:13px;color:var(--ink-soft);margin-top:3px}
.go{background:linear-gradient(180deg,var(--pink),var(--pink-b));color:#fff;font-weight:700;padding:11px 18px;border-radius:10px;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 4px 12px rgba(217,65,143,.4)}
.go svg{width:16px;height:16px}
.scroller{display:flex;flex-direction:column;justify-content:center;gap:10px}
.scroller button{width:48px;height:48px;border-radius:50%;background:rgba(20,25,50,.45);border:2px solid #fff;display:grid;place-items:center}
.scroller svg{width:20px;height:20px}

/* viewer overlay */
.viewer{position:fixed;inset:0;background:rgba(15,20,40,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:10}
.viewer[hidden]{display:none!important}
.sheet{width:min(1100px,100%);height:min(86vh,760px);background:var(--paper);color:var(--paper-ink);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.sheet .page{flex:1;min-height:0;overflow:auto;padding:clamp(20px,4vw,56px) clamp(20px,5vw,72px);position:relative}
.page .mark{position:absolute;top:18px;right:24px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--paper-soft)}
.page .mark i{width:26px;height:26px;border-radius:50%;border:2px dashed var(--paper-soft);display:grid;place-items:center;font-style:normal;font-size:8px}
.page h2{color:var(--alert);margin:0 0 10px;font-size:clamp(22px,2.4vw,34px)}
.page h3{color:var(--alert);margin:26px 0 8px;font-size:clamp(18px,1.8vw,24px)}
.page p,.page li{font-size:clamp(15px,1.4vw,20px);line-height:1.55;max-width:62ch;margin:0 0 8px}
.page ul{padding-left:22px;margin:6px 0 12px}
.page table{border-collapse:collapse;font-size:clamp(14px,1.3vw,18px);margin-top:8px;font-variant-numeric:tabular-nums;min-width:min(520px,100%)}
.page td,.page th{padding:9px 16px;border-bottom:1px solid #e3e6ef;text-align:left}
.page th{color:var(--paper-soft);font-weight:600}
.page .note{font-size:13px;color:var(--paper-soft);margin-top:18px}
.ctrl{display:flex;justify-content:center;align-items:center;gap:12px;padding:14px;border-top:1px solid #eceef5;flex-wrap:wrap}
.ctrl button{display:flex;align-items:center;gap:8px;background:#fff;color:var(--paper-ink);border:1.5px solid #d7c3dc;border-radius:999px;padding:8px 18px;font-weight:600;font-size:15px}
.ctrl button svg{width:16px;height:16px;color:var(--pink-b)}
.ctrl button:disabled{opacity:.35}
.ctrl .count{font-size:14px;color:var(--paper-soft);font-variant-numeric:tabular-nums;min-width:60px;text-align:center}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--paper)}
.loading[hidden]{display:none!important}
.loading div{background:#2b2f3c;color:#fff;border-radius:12px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:12px;font-weight:600}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* feedback */
.faces{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}
.faces button{font-size:clamp(40px,5vw,64px);background:#f3f4f9;border-radius:18px;padding:12px 18px;line-height:1;border:2px solid transparent}
.faces button[aria-pressed="true"]{border-color:var(--pink-b);background:#fde8f3}
.thanks{color:#2f8a4b;font-weight:700}

/* idle toast + prototype tag */
.idle{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(15,20,40,.85);padding:12px 20px;border-radius:12px;font-weight:600;z-index:20;display:flex;gap:14px;align-items:center}
.idle[hidden]{display:none!important}
.idle button{background:#fff;color:var(--stage-a);border-radius:8px;padding:6px 12px;font-weight:700}
.proto{position:fixed;right:12px;bottom:10px;font-size:11px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;z-index:5}

@media (max-width:860px){
  .home{grid-template-columns:1fr;align-content:start;overflow:auto}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gridwrap{place-items:start center;overflow:auto}
  .logo{display:none}
  .scroller{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="stage">
  <header class="bar">
    <div class="crumb" id="crumb" hidden></div>
    <h1 id="title"></h1>
    <button class="navbtn" id="back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg><span data-t="back"></span></button>
    <button class="navbtn" id="homeBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="home"></span></button>
    <button class="pill" id="lang">中文</button>
    <div class="logo"><i>LOGO</i><span>Your<br>Brand</span></div>
  </header>

  <main>
    <section class="screen home" id="s-home">
      <div class="hero"><canvas id="sea" width="960" height="600"></canvas><span class="cap" id="heroCap"></span></div>
      <div class="pick">
        <p><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg><span data-t="tap"></span></p>
        <div class="countries" id="countries"></div>
      </div>
    </section>

    <section class="screen" id="s-cats" hidden>
      <div class="gridwrap"><div class="tiles" id="tiles"></div></div>
    </section>

    <section class="screen" id="s-list" hidden>
      <div class="listwrap">
        <div class="list" id="list"></div>
        <div class="scroller">
          <button id="up" aria-label="Scroll up"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M6 15l6-6 6 6"/></svg></button>
          <button id="down" aria-label="Scroll down"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="sheet">
    <div class="page" id="page"></div>
    <div class="ctrl">
      <button id="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span data-t="prev"></span></button>
      <span class="count" id="count"></span>
      <button id="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span data-t="next"></span></button>
      <button id="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-t="close"></span></button>
    </div>
  </div>
  <div class="loading" id="loading" hidden><div><span class="spin"></span><span data-t="loading"></span></div></div>
</div>

<div class="idle" id="idle" hidden><span id="idleTxt"></span><button id="stay" data-t="stay"></button></div>
<div class="proto">Prototype · sample content</div>

/* ---------- APP ---------- */
const IDLE_SECONDS=60, WARN_SECONDS=10;
let lang="en", country=null, cat=null, doc=null, pg=0, rating=null;
const $=id=>document.getElementById(id);
const t=k=>UI[lang][k];

function show(screen){for(const s of ["home","cats","list"])$("s-"+s).hidden=s!==screen;state.screen=screen;renderBar();}
const state={screen:"home"};

function flagHTML(c,size){return `<span class="flag" style="flex-direction:${c.dir};${size?`width:${size}px;height:${size}px;box-shadow:0 0 0 2px #fff`:""}">${c.flag.map((col,i)=>`<span style="background:${col};${c.dir==="column"&&i===1?"flex:2":""}"></span>`).join("")}</span>`}

function renderBar(){
  const s=state.screen;
  $("back").hidden=s==="home"; $("homeBtn").hidden=s==="home";
  $("crumb").hidden=s==="home";
  if(s==="home"){$("title").textContent=t("welcome");}
  else{
    $("crumb").innerHTML=flagHTML(country,34);
    $("title").textContent=country.name[lang]+(s==="list"?" · "+cat.name[lang]:"");
  }
  $("lang").textContent=t("lang");
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $("heroCap").textContent=t("hero");
}
function renderCountries(){
  $("countries").innerHTML=COUNTRIES.map((c,i)=>`<button class="country" data-c="${c.id}">${flagHTML(c).replace('class="flag"',`class="flag${i===0?" pulse":""}"`)}<span>${c.name[lang]}</span></button>`).join("");
}
function renderTiles(){
  $("tiles").innerHTML=CATS.map(c=>`<button class="tile" data-cat="${c.id}"><svg viewBox="0 0 24 24">${I[c.icon]}</svg><span>${c.name[lang]}</span></button>`).join("");
}
function renderList(){
  $("list").innerHTML=DOCS[cat.id].map((d,i)=>`<div class="row"><b>${d.t[lang]}${d.s?`<small>${d.s[lang]}</small>`:""}</b><button class="go" data-doc="${i}">${t("view")}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>`).join("");
  $("list").scrollTop=0;
}
function renderAll(){renderBar();renderCountries();renderTiles();if(cat)renderList();if(!$("viewer").hidden)renderPage();}

function openDoc(i){
  doc=DOCS[cat.id][i]; pg=0; rating=null;
  $("viewer").hidden=false; $("loading").hidden=false;
  setTimeout(()=>{$("loading").hidden=true;renderPage();},650);
}
function renderPage(){
  const mark=`<div class="mark"><i>LOGO</i>Your Brand</div>`;
  if(doc.feedback){
    const faces=["😞","😐","🙂","😄"];
    $("page").innerHTML=mark+`<h2>${doc.t[lang]}</h2><p>${lang==="en"?"Tap a face to tell us how we did.":"请点击表情，告诉我们您的感受。"}</p><div class="faces">${faces.map((f,i)=>`<button data-rate="${i}" aria-pressed="${rating===i}">${f}</button>`).join("")}</div>${rating!==null?`<p class="thanks">${lang==="en"?"Thank you for your feedback.":"感谢您的反馈。"}</p>`:""}<p class="note">${lang==="en"?"In the prototype, ratings are not saved.":"原型中不保存评分。"}</p>`;
  } else $("page").innerHTML=mark+doc.pages[pg][lang];
  $("page").scrollTop=0;
  $("count").textContent=t("page")(pg+1,doc.pages.length);
  $("prev").disabled=pg===0; $("next").disabled=pg>=doc.pages.length-1;
}
function closeDoc(){$("viewer").hidden=true;doc=null;}
function goHome(){closeDoc();country=null;cat=null;show("home");}

/* events */
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-c]"); if(c){country=COUNTRIES.find(x=>x.id===c.dataset.c);show("cats");return;}
  const k=e.target.closest("[data-cat]"); if(k){cat=CATS.find(x=>x.id===k.dataset.cat);renderList();show("list");return;}
  const d=e.target.closest("[data-doc]"); if(d){openDoc(+d.dataset.doc);return;}
  const r=e.target.closest("[data-rate]"); if(r){rating=+r.dataset.rate;renderPage();return;}
});
$("back").onclick=()=>{if(state.screen==="list"){cat=null;show("cats");}else goHome();};
$("homeBtn").onclick=goHome;
$("lang").onclick=()=>{lang=lang==="en"?"zh":"en";document.documentElement.lang=lang==="en"?"en":"zh-CN";renderAll();};
$("prev").onclick=()=>{if(pg>0){pg--;renderPage();}};
$("next").onclick=()=>{if(pg<doc.pages.length-1){pg++;renderPage();}};
$("close").onclick=closeDoc;
$("viewer").addEventListener("click",e=>{if(e.target===$("viewer"))closeDoc();});
$("up").onclick=()=>$("list").scrollBy({top:-240});
$("down").onclick=()=>$("list").scrollBy({top:240});

/* idle reset: back to start after inactivity */
let last=Date.now();
["pointerdown","keydown","wheel","touchstart"].forEach(ev=>addEventListener(ev,()=>{last=Date.now();$("idle").hidden=true;},{passive:true}));
$("stay").onclick=()=>{last=Date.now();$("idle").hidden=true;};
setInterval(()=>{
  if(state.screen==="home"&&$("viewer").hidden){$("idle").hidden=true;return;}
  const left=IDLE_SECONDS-Math.floor((Date.now()-last)/1000);
  if(left<=0){goHome();$("idle").hidden=true;last=Date.now();}
  else if(left<=WARN_SECONDS){$("idle").hidden=false;$("idleTxt").textContent=t("idle")(left);}
},500);

/* attract-loop hero: a drawn harbour scene with moving water (stands in for a photo/video) */
(function(){
  const cv=$("sea"),x=cv.getContext("2d"),W=cv.width,H=cv.height;
  const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(7);
  const houses=[];let px=0;
  while(px<W){const w=30+rnd()*50,h=60+rnd()*110;houses.push({x:px,w,h,c:["#c9744c","#d98a5b","#b8603f","#e3a06d","#a9553a","#e9c39b"][Math.floor(rnd()*6)]});px+=w-4;}
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function draw(time){
    const g=x.createLinearGradient(0,0,0,H*.5);g.addColorStop(0,"#9fc4e4");g.addColorStop(1,"#e7eef3");x.fillStyle=g;x.fillRect(0,0,W,H);
    const hz=H*.48;
    x.fillStyle="#b7c7d3";x.fillRect(0,hz-30,W,30);
    houses.forEach(h=>{const y=hz+40-h.h;x.fillStyle=h.c;x.fillRect(h.x,y,h.w,h.h);x.fillStyle="rgba(0,0,0,.18)";for(let wy=y+12;wy<hz+30;wy+=22)for(let wx=h.x+8;wx<h.x+h.w-8;wx+=14)x.fillRect(wx,wy,6,9);x.fillStyle="#8e4630";x.fillRect(h.x-2,y-6,h.w+4,8);});
    // dome
    x.fillStyle="#efe9dc";x.fillRect(W*.62,hz-110,120,150);x.beginPath();x.arc(W*.62+60,hz-110,62,Math.PI,0);x.fill();x.fillRect(W*.62+52,hz-200,16,30);
    const wg=x.createLinearGradient(0,hz+40,0,H);wg.addColorStop(0,"#3fa7a5");wg.addColorStop(1,"#1d6f86");x.fillStyle=wg;x.fillRect(0,hz+40,W,H);
    x.strokeStyle="rgba(255,255,255,.35)";x.lineWidth=2;
    for(let i=0;i<14;i++){const y=hz+60+i*22;x.beginPath();for(let xx=0;xx<=W;xx+=20){const yy=y+Math.sin(xx/40+time/700+i)*3;xx?x.lineTo(xx,yy):x.moveTo(xx,yy);}x.stroke();}
    const bx=((time/30)%(W+120))-60;x.fillStyle="#fff";x.beginPath();x.moveTo(bx,hz+150);x.lineTo(bx+60,hz+150);x.lineTo(bx+48,hz+164);x.lineTo(bx+8,hz+164);x.fill();
    if(!reduce)requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

renderAll(); show("home");
</script>
</body>
